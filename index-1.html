<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NaijaConnect: Social Hub</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6faf7;--card:#fff;--tx:#12261a;--mut:#5b6f62;--ac:#0a7a3d;--bd:#dbe7de}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#16231b;--tx:#e8f2ea;--mut:#9ab0a1;--ac:#3fd382;--bd:#25382c}}
:root[data-theme="dark"]{--bg:#0e1712;--card:#16231b;--tx:#e8f2ea;--mut:#9ab0a1;--ac:#3fd382;--bd:#25382c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{padding:28px 18px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:26px}h1 span{color:var(--ac)}
p.sub{margin:6px 0 0;color:var(--mut)}
nav{display:flex;gap:8px;max-width:760px;margin:14px auto 0;padding:0 18px}
nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:760px;margin:auto;padding:14px 18px 40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h2{font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card b{display:block;font-size:16px}.card small{color:var(--mut)}
.dot{display:inline-block;width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;text-align:center;line-height:34px;font-weight:700;margin-bottom:8px}
.lg{width:34px;height:34px;border-radius:8px;object-fit:cover;display:block;margin-bottom:8px}.lg.w{width:auto;max-width:100%;object-fit:contain;border-radius:4px}.hidden{display:none}
textarea{width:100%;min-height:80px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);font:inherit;resize:vertical}
.send{margin-top:8px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
.post{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-top:10px}
.post small{color:var(--mut)}.post p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
select{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px;font:inherit;margin-bottom:8px}#fc{margin-top:10px}input{display:block;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin-bottom:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.send.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.del{float:right;border:0;background:none;color:var(--mut);cursor:pointer}#bar{margin-bottom:10px}.note{color:var(--mut);font-size:14px}
</style></head><body>
<header><h1>Naija<span>Connect</span></h1><p class="sub">Every social platform in one place, for Nigerians and the world, plus our own community.</p></header>
<nav><button id="t-hub" class="on">Social Hub</button><button id="t-com">Community</button></nav>
<main>
<section id="hub">
<div class="chips" id="chips"></div>
<div id="lists"></div>
</section>
<section id="com" class="hidden">
<div id="bar" class="hidden"><span id="who"></span> <button class="chip" id="out">Sign out</button></div>
<div id="auth"><p class="note">Sign in to post. Everyone can read.</p><input id="nm" placeholder="Your name (for new accounts)"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password (6+ characters)"><div class="row"><button class="send" id="in">Sign in</button><button class="send alt" id="up">Create account</button></div></div>
<div id="compose" class="hidden"><select id="pc"><option>General</option><option>Tech</option><option>Fashion</option><option>Business</option><option>Education</option><option>Music</option></select><textarea id="msg" maxlength="500" placeholder="Say hello or share something with the community..."></textarea><button class="send" id="send">Post</button></div>
<p class="note" id="cnote"></p>
<select id="fc"><option value="">All categories</option><option>General</option><option>Tech</option><option>Fashion</option><option>Business</option><option>Education</option><option>Music</option></select><div id="feed"></div>
</section>
</main>

const lists=document.getElementById("lists"),chips=document.getElementById("chips");
const SKIP=["Channels TV","Premium Times"];
function badge(n){if(SKIP.includes(n))return '<span class="dot">'+n[0]+'</span>';let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;const w=n.split(/\s+/);const t=w.length>1?w[0][0]+w[1][0]:n.slice(0,2);return '<span class="dot" style="background:hsl('+h+',55%,38%);font-size:13px">'+t.replace(/[<&]/g,"")+'</span>'}
function cards(a){return '<div class="grid">'+a.map(p=>'<a class="card" href="'+p[1]+'" target="_blank" rel="noopener">'+(LOGO[p[0]]?'<img class="lg'+(WIDE.includes(p[0])?' w':'')+'" alt="" src="'+LOGO[p[0]]+'">':badge(p[0]))+'<b>'+p[0]+'</b><small>'+p[2]+' · '+p[3]+'</small></a>').join("")+'</div>'}
function chipRow(items,key,cur){return '<div class="chips">'+items.map(c=>'<button class="chip'+(cur===c[0]?' on':'')+'" data-'+key+'="'+c[0]+'">'+c[1]+'</button>').join("")+'</div>'}
function renderHub(){
chips.innerHTML=chipRow([["all","All"],["ng","Nigerian sites"],["wd","Around the world"]],"r",reg)+chipRow([["all","Any type"]].concat(CATS.map(c=>[c,c])),"c",cat);
const f=P.filter(p=>cat==="all"||p[3]===cat);let h="";
const n=f.filter(p=>p[4]==="ng"),w=f.filter(p=>p[4]==="wd");
if(reg!=="wd"&&n.length)h+="<h2>Nigerian sites &amp; platforms</h2>"+cards(n);
if(reg!=="ng"&&w.length)h+="<h2>Around the world</h2>"+cards(w);
lists.innerHTML=h||'<p class="note">Nothing here yet.</p>'}
chips.onclick=e=>{const d=e.target.dataset;if(d.r){reg=d.r;renderHub()}else if(d.c){cat=d.c;renderHub()}};
renderHub();
const tH=document.getElementById("t-hub"),tC=document.getElementById("t-com");
function tab(c){document.getElementById("hub").classList.toggle("hidden",c);document.getElementById("com").classList.toggle("hidden",!c);tH.classList.toggle("on",!c);tC.classList.toggle("on",c)}
tH.onclick=()=>tab(false);tC.onclick=()=>tab(true);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,query,orderBy,limit,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// 1) Paste your Firebase web app settings here (Firebase console > Project settings > Your apps)
const cfg={apiKey:"AIzaSyDnS-WIHinGYgnA9RENywWxTu1pwAGw8rU",authDomain:"niger-66.firebaseapp.com",projectId:"niger-66",storageBucket:"niger-66.firebasestorage.app",messagingSenderId:"900744922748",appId:"1:900744922748:web:d17c23eaa06e7a97df2bf9"};
const $=id=>document.getElementById(id),note=$("cnote"),feed=$("feed");
if(cfg.apiKey.startsWith("PASTE")){note.textContent="Community is off until you add your Firebase settings.";$("auth").classList.add("hidden");$("fc").classList.add("hidden")}
else{
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
let me=null,all=[];
const err=e=>{note.textContent=(e&&e.code?e.code.replace("auth/","").replace(/-/g," "):"Something went wrong")};
function draw(){
const fv=$("fc").value,ds=all.filter(d=>!fv||d.c===fv);feed.innerHTML="";
if(!ds.length){feed.innerHTML='<p class="note">No posts yet. Be the first!</p>';return}
ds.forEach(d=>{const el=document.createElement("div");el.className="post";
const s=document.createElement("small"),t=d.t&&d.t.toDate?d.t.toDate().toLocaleString():"just now";
s.textContent=(d.name||"Someone")+" · "+(d.c||"General")+" · "+t;
if(me&&d.u===me.uid){const b=document.createElement("button");b.className="del";b.textContent="Delete";b.onclick=()=>deleteDoc(doc(db,"posts",d.id)).catch(err);el.append(b)}
const p=document.createElement("p");p.textContent=d.text;el.append(s,p);feed.append(el)})}
onAuthStateChanged(auth,u=>{me=u;note.textContent="";$("auth").classList.toggle("hidden",!!u);$("compose").classList.toggle("hidden",!u);$("bar").classList.toggle("hidden",!u);$("who").textContent=u?"Signed in as "+(u.displayName||u.email):"";draw()});
$("in").onclick=()=>signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value).catch(err);
$("up").onclick=()=>{const em=$("em").value.trim();createUserWithEmailAndPassword(auth,em,$("pw").value).then(c=>updateProfile(c.user,{displayName:$("nm").value.trim()||em.split("@")[0]})).then(()=>{me=auth.currentUser;$("who").textContent="Signed in as "+me.displayName;draw()}).catch(err)};
$("out").onclick=()=>signOut(auth);
$("fc").onchange=draw;
onSnapshot(query(collection(db,"posts"),orderBy("t","desc"),limit(50)),snap=>{all=snap.docs.map(d=>({id:d.id,...d.data()}));draw()},()=>{note.textContent="Could not load posts."});
$("send").onclick=()=>{const m=$("msg"),v=m.value.trim();if(!v||!me)return;
addDoc(collection(db,"posts"),{text:v.slice(0,500),u:me.uid,name:me.displayName||me.email.split("@")[0],c:$("pc").value,t:serverTimestamp()}).then(()=>{m.value=""}).catch(err)};
}
</script>
